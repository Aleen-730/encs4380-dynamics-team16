
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Module 3 - Second Order Response</title>

    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>

<body>

    <h2>Module 3: Second-Order Response</h2>

    <h3>Input Parameters</h3>

    <p>
        Damping Ratio (ζ) =
        <span id="zetaValue">0.5</span>
    </p>
    <input type="range" id="zeta"
           min="0.1" max="2" step="0.1" value="0.5">

    <p>
        Natural Frequency (ωn) =
        <span id="wnValue">2</span> rad/s
    </p>
    <input type="range" id="wn"
           min="0.5" max="10" step="0.5" value="2">

    <h3>System Characteristics</h3>

    <p>Damping Type: <span id="dampingType"></span></p>

    <h3>Step Response</h3>

    <div id="responsePlot"></div>

    <script>

        function updateModule3() {

            // Read slider values
            var zeta = Number(document.getElementById("zeta").value);
            var wn = Number(document.getElementById("wn").value);

            // Display values
            document.getElementById("zetaValue").innerHTML = zeta;
            document.getElementById("wnValue").innerHTML = wn;

            // Determine damping type
            var damping;

            if (zeta < 1) {
                damping = "Underdamped";
            }
            else if (zeta === 1) {
                damping = "Critically Damped";
            }
            else {
                damping = "Overdamped";
            }

            document.getElementById("dampingType").innerHTML = damping;

            // Create time and response arrays
            var time = [];
            var response = [];

            // Calculate step response
            for (var t = 0; t <= 10; t += 0.02) {

                var y;

                if (zeta < 1) {

                    // Underdamped response
                    var wd = wn * Math.sqrt(1 - zeta * zeta);

                    y = 1 - Math.exp(-zeta * wn * t) *
                    (
                        Math.cos(wd * t) +
                        (zeta / Math.sqrt(1 - zeta * zeta))
                        * Math.sin(wd * t)
                    );

                }

                else if (zeta === 1) {

                    // Critically damped response
                    y = 1 - (1 + wn * t) * Math.exp(-wn * t);

                }

                else {

                    // Overdamped response
                    var root = Math.sqrt(zeta * zeta - 1);

                    var r1 = -wn * (zeta - root);
                    var r2 = -wn * (zeta + root);

                    y = 1 +
                    (
                        r2 * Math.exp(r1 * t) -
                        r1 * Math.exp(r2 * t)
                    ) / (r1 - r2);

                }

                time.push(t);
                response.push(y);
            }

            // Draw the response graph
            var trace = {
                x: time,
                y: response,
                mode: "lines",
                name: "System Response"
            };

            var layout = {
                title: "Second-Order Step Response",
                xaxis: {
                    title: "Time (s)"
                },
                yaxis: {
                    title: "Output",
                    range: [-0.1, 2]
                }
            };

            Plotly.newPlot("responsePlot", [trace], layout,
                {responsive: true});

        }

        // Update when sliders move
        document.getElementById("zeta").oninput = updateModule3;
        document.getElementById("wn").oninput = updateModule3;

        // Initial update
        updateModule3();

    </script>

</body>
</html>
