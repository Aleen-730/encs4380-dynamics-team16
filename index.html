<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hw1</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>

<h2>first order step response</h2>
<p>y(t)=Ak(1-exp(-t/tau))</p>

<p>tau=<span id="tauval">1</span></p>
<input type="range" id="tau" min="0.1" max="5" step="0.1" value="1">

<div id="graph"></div>
<p id="test"></p>

<script>
var A=1
var k=1

function update(){
  var tau=Number(document.getElementById("tau").value)
  document.getElementById("tauval").innerHTML=tau

  var t=[]
  var y=[]
  for(var i=0;i<=250;i++){
    t.push(i*0.1)
    y.push(A*k*(1-Math.exp(-(i*0.1)/tau)))
  }

  Plotly.newPlot("graph",[{x:t,y:y}])

  var p=(1-Math.exp(-tau/tau))*100
  var res="fail"
  if(Math.abs(p-63.2)<0.1) res="pass"
  document.getElementById("test").innerHTML="y(tau)="+p.toFixed(1)+"% should be 63.2% "+res
}

document.getElementById("tau").oninput=update
update()
</script>

</body>
</html>
